<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Step 1: Time Correction -->
  <rect x="20" y="55" width="130" height="90" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="85" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">1. Time</text>
  <text x="85" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Correction</text>
  <text x="85" y="116" text-anchor="middle" font-size="9" fill="#64748B">ActiveTime</text>
  <text x="85" y="128" text-anchor="middle" font-size="9" fill="#64748B">Correction</text>

  <!-- Arrow 1?2 -->
  <line x1="155" y1="100" x2="180" y2="100" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Deskewing -->
  <rect x="185" y="55" width="130" height="90" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="250" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">2. Deskewing</text>
  <text x="250" y="102" text-anchor="middle" font-size="9" fill="#64748B">auto | imu_deskew</text>
  <text x="250" y="114" text-anchor="middle" font-size="9" fill="#64748B">constant_velocity</text>
  <text x="250" y="126" text-anchor="middle" font-size="9" fill="#64748B">none</text>

  <!-- Arrow 2?3 -->
  <line x1="320" y1="100" x2="345" y2="100" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Aggregation -->
  <rect x="350" y="55" width="130" height="90" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="415" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">3. Point</text>
  <text x="415" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Aggregation</text>
  <text x="415" y="116" text-anchor="middle" font-size="9" fill="#64748B">min/max range</text>
  <text x="415" y="128" text-anchor="middle" font-size="9" fill="#64748B">filter + merge</text>

  <!-- Arrow 3?4 -->
  <line x1="485" y1="100" x2="510" y2="100" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Registration -->
  <rect x="515" y="55" width="140" height="90" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="585" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#991B1B">4. Frame-to-Map</text>
  <text x="585" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#991B1B">Registration</text>
  <text x="585" y="114" text-anchor="middle" font-size="9" fill="#64748B">Iterative closest</text>
  <text x="585" y="126" text-anchor="middle" font-size="9" fill="#64748B">point solver</text>

  <!-- Reference Map (below step 4) -->
  <rect x="530" y="168" width="110" height="42" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="585" y="185" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Reference Map</text>
  <text x="585" y="200" text-anchor="middle" font-size="9" fill="#64748B">PLY / PCD (read-only)</text>

  <!-- Arrow Reference Map ? Step 4 (upward) -->
  <line x1="585" y1="166" x2="585" y2="149" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow 4?5 -->
  <line x1="660" y1="100" x2="685" y2="100" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Pose Interpolation -->
  <rect x="690" y="55" width="190" height="90" rx="6" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="785" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#6B21A8">5. Pose</text>
  <text x="785" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#6B21A8">Interpolation</text>
  <text x="785" y="114" text-anchor="middle" font-size="9" fill="#64748B">Per-column SE(3)</text>
  <text x="785" y="126" text-anchor="middle" font-size="9" fill="#64748B">&#x2192; LidarFrame.body_to_world</text>

  <!-- Labels -->
  <text x="85" y="42" text-anchor="middle" font-size="9" fill="#94A3B8">FrameSet in</text>
  <text x="785" y="42" text-anchor="middle" font-size="9" fill="#94A3B8">Poses written in-place</text>
</svg>
